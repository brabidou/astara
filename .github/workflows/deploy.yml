name: Deploy to Pressable

on:
  push:
    branches: [main]
    paths:
      - "theme/astara/**"
      - "tests/**"
      - "playwright.config.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Accept the current look of the site as the new visual baseline"
        type: boolean
        default: false

concurrency:
  group: deploy-pressable
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy theme via rsync over SSH
        env:
          SSHPASS: ${{ secrets.PRESSABLE_SFTP_PASSWORD }}
          REMOTE_HOST: ${{ secrets.PRESSABLE_SFTP_HOST }}
          REMOTE_USER: ${{ secrets.PRESSABLE_SFTP_USER }}
          REMOTE_PORT: ${{ secrets.PRESSABLE_SFTP_PORT }}
          REMOTE_PATH: ${{ secrets.PRESSABLE_DEPLOY_PATH }}
        run: |
          sshpass -e rsync -rlgoDzvc --delete \
            -e "ssh -p ${REMOTE_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude=".git*" \
            --exclude="node_modules" \
            --exclude=".wp-env.json" \
            --exclude=".env*" \
            theme/astara/ \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}"

  # Runs the Playwright suite (accessibility, structure, design values,
  # behaviour, visual) against the staging site once the new theme is live.
  # Deploy has already happened by this point, so a red run means "fix forward".
  test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CI: "true"
      E2E_BASE_URL: https://astara.mystagingwebsite.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Functional, accessibility and design-value tests
        run: npx playwright test --grep-invert visual

      # Screenshot baselines are big and platform-specific, so they live in the
      # Actions cache rather than git. The first run (or a manual run with the
      # "update baselines" box ticked) records them; later runs compare.
      - name: Restore visual baselines
        id: baselines
        uses: actions/cache/restore@v6
        with:
          path: tests/e2e/visual.spec.js-snapshots
          key: visual-baselines-${{ github.run_id }}
          restore-keys: visual-baselines-

      - name: Visual tests
        run: |
          if [ "${{ inputs.update_visual_baselines }}" = "true" ]; then
            npx playwright test visual --update-snapshots
          elif [ -n "${{ steps.baselines.outputs.cache-matched-key }}" ]; then
            npx playwright test visual
          else
            echo "No baselines yet: recording them now."
            npx playwright test visual --update-snapshots
          fi

      - name: Save visual baselines
        if: always()
        uses: actions/cache/save@v6
        with:
          path: tests/e2e/visual.spec.js-snapshots
          key: visual-baselines-${{ github.run_id }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
